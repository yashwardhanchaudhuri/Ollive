[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollive"
version = "0.1.0"
description = "Ollive Wellness Assistant"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.59,<2",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.2,<2",
    "pydantic>=2.13,<3",
    "openai>=2.46,<3",
    "sentence-transformers>=5.6,<6",
    "numpy>=2.0,<3",
    "faiss-cpu>=1.14,<2",
    "tavily-python>=0.7,<1",
    "langfuse>=4.14,<5",
]

[project.optional-dependencies]
local = [
    "vllm==0.25.0",
    "huggingface-hub>=1.2,<2",
]
dev = ["pytest>=9.1,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
