<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#55766a"/></marker>
  <style>.title{font:700 28px Arial;fill:#244f41}.label{font:700 17px Arial;fill:#24352f}.small{font:14px Arial;fill:#42534c}.box{stroke:#799989;stroke-width:2;rx:14}.arrow{stroke:#55766a;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#9b7d58;stroke-width:3;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}.edge{font:700 12px Arial;fill:#55766a}.failEdge{font:700 12px Arial;fill:#8b6845}</style>
</defs>
<rect width="1200" height="1320" fill="#fbfaf7"/>
<text x="40" y="48" class="title">Ollive agent workflow</text>
<text x="40" y="76" class="small">One bounded turn: classify context, select policy, retrieve current-turn evidence, then validate before display.</text>

<rect x="450" y="105" width="300" height="62" class="box" fill="#dce9e1"/>
<text x="600" y="132" text-anchor="middle" class="label">Streamlit UI</text>
<text x="600" y="153" text-anchor="middle" class="small">user turn + session state</text>
<path d="M600 167V200" class="arrow"/>

<rect x="390" y="200" width="420" height="68" class="box" fill="#e8f0ec"/>
<text x="600" y="228" text-anchor="middle" class="label">WellnessAgent.chat()</text>
<text x="600" y="251" text-anchor="middle" class="small">memory checkpoint + usage + trace</text>
<path d="M600 268V300" class="arrow"/>

<rect x="355" y="300" width="490" height="70" class="box" fill="#f7f4ed"/>
<text x="600" y="329" text-anchor="middle" class="label">Context-dependency classifier</text>
<text x="600" y="352" text-anchor="middle" class="small">focused LLM decision: current or prior + current</text>
<path d="M600 370V402" class="arrow"/>

<rect x="355" y="402" width="490" height="70" class="box" fill="#f7f4ed"/>
<text x="600" y="431" text-anchor="middle" class="label">Policy router</text>
<text x="600" y="454" text-anchor="middle" class="small">domain route + depth + explicit web requirement</text>

<path d="M355 437H190V505" class="arrow"/>
<rect x="35" y="505" width="310" height="82" class="box" fill="#f3f0ea"/>
<text x="190" y="536" text-anchor="middle" class="label">Non-grounded routes</text>
<text x="190" y="560" text-anchor="middle" class="small">conversation / clarification / out of scope</text>

<path d="M600 472V505" class="arrow"/>
<rect x="440" y="505" width="320" height="82" class="box" fill="#f7eeee"/>
<text x="600" y="536" text-anchor="middle" class="label">Medical urgency selector</text>
<text x="600" y="560" text-anchor="middle" class="small">forced standard-or-urgent schema</text>
<path d="M600 587V620" class="arrow"/>
<rect x="440" y="620" width="320" height="78" class="box" fill="#f7eeee"/>
<text x="600" y="651" text-anchor="middle" class="label">Application-owned boundary</text>
<text x="600" y="675" text-anchor="middle" class="small">model cannot compose clinical facts</text>

<path d="M845 437H1010V505" class="arrow"/>
<rect x="855" y="505" width="310" height="82" class="box" fill="#e8f0ec"/>
<text x="1010" y="536" text-anchor="middle" class="label">Bounded query builder</text>
<text x="1010" y="560" text-anchor="middle" class="small">verbatim user text; no query rewriting</text>
<path d="M1010 587V620" class="arrow"/>

<rect x="855" y="620" width="310" height="78" class="box" fill="#e8f0ec"/>
<text x="1010" y="651" text-anchor="middle" class="label">lookup_kb</text>
<text x="1010" y="675" text-anchor="middle" class="small">application-bound query + retrieved passages</text>
<path d="M1010 698V730" class="arrow"/>
<text x="1032" y="719" class="edge">gap / required</text>
<path d="M855 659H810V842H855" class="arrow"/>
<text x="798" y="758" text-anchor="end" class="edge">sufficient</text>

<rect x="855" y="730" width="310" height="78" class="box" fill="#fff1df"/>
<text x="1010" y="761" text-anchor="middle" class="label">search_web, at most once</text>
<text x="1010" y="785" text-anchor="middle" class="small">advanced extraction from allowlisted domains</text>
<path d="M1010 808V842" class="arrow"/>

<rect x="855" y="842" width="310" height="78" class="box" fill="#dce9e1"/>
<text x="1010" y="873" text-anchor="middle" class="label">submit_grounded_answer</text>
<text x="1010" y="897" text-anchor="middle" class="small">bounded items + current-turn markers</text>
<path d="M1010 920V952" class="arrow"/>

<rect x="855" y="952" width="310" height="78" class="box" fill="#dce9e1"/>
<text x="1010" y="983" text-anchor="middle" class="label">Contract validation</text>
<text x="1010" y="1007" text-anchor="middle" class="small">shape + bounds + marker provenance</text>
<path d="M1010 1030V1062" class="arrow"/>

<rect x="855" y="1062" width="310" height="78" class="box" fill="#dce9e1"/>
<text x="1010" y="1093" text-anchor="middle" class="label">Claim entailment verifier</text>
<text x="1010" y="1117" text-anchor="middle" class="small">isolated claim/source verdicts</text>

<rect x="450" y="1190" width="300" height="78" class="box" fill="#e8f0ec"/>
<text x="600" y="1221" text-anchor="middle" class="label">Render + remember</text>
<text x="600" y="1245" text-anchor="middle" class="small">answer + clickable source context</text>
<path d="M855 1101H800V1229H750" class="arrow"/>
<path d="M190 587H390V1229H450" class="arrow"/>
<path d="M600 698V1190" class="arrow"/>

<rect x="35" y="952" width="300" height="104" class="box" fill="#f7eeee"/>
<text x="185" y="985" text-anchor="middle" class="label">Best effort or withhold</text>
<text x="185" y="1010" text-anchor="middle" class="small">exact-gap notice + verified cited subset;</text>
<text x="185" y="1033" text-anchor="middle" class="small">unsupported output is never displayed</text>
<path d="M855 991H335" class="dash"/>
<text x="570" y="982" text-anchor="middle" class="failEdge">invalid contract</text>
<path d="M855 1123H790V1290H365V1030H335" class="dash"/>
<text x="575" y="1308" text-anchor="middle" class="failEdge">unsupported claim</text>
</svg>
